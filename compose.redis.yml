# Local development only; bind Redis to this computer.
services:
  redis:
    image: redis:7.4-alpine
    ports:
      - "127.0.0.1:6379:6379"
    command: [ "redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction" ]
    volumes:
      - ibkr-redis-data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5
volumes:
  ibkr-redis-data:
